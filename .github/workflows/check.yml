name: Check and Test

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: MoonBit ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Toolchain and dependencies
        run: |
          moon version --all
          moon update
      - name: Strict type check
        run: moon check --target all --deny-warn
      - name: Tests
        run: moon test --target all --deny-warn
      - name: Native tests
        run: moon test --target native --deny-warn
      - name: CLI smoke test
        run: moon run cmd/main --target native
      - name: Format and public API check
        shell: bash
        run: |
          moon fmt --check
          git diff --exit-code
          moon info --target all
          git diff --exit-code

  coverage:
    name: Coverage summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install latest stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: moon update
      - name: Test with coverage
        run: |
          moon test --target native --deny-warn --enable-coverage
          moon coverage report -f summary
          moon coverage analyze
